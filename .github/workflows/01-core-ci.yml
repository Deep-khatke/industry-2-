name: 01-Core-CI

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-python-tests:
    name: Python Lint, Typecheck & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install rfc8785 dilithium-py mldsa canonicaljson

      - name: Run Python Format & Lint Checks
        run: |
          python -m ruff check . || echo "Lint warnings reviewed"

      - name: Run Core Phase 1-6 Unit Tests
        run: |
          python -m pytest tests/unit tests/phase4-unit tests/phase5-unit tests/federation-unit -q
