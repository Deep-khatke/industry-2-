name: "Phase 8 — System End-to-End Integration"

on:
  push:
    branches: ["main", "feature/phase8-integration-reliability"]
    paths:
      - "services/**"
      - "tools/phase8/**"
      - "tests/system/end_to_end/**"
      - ".github/workflows/phase8-system-integration.yml"
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: phase8-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-integration:
    name: "End-to-End Telemetry to Response Pipeline"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "Checkout repository code"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: "Set up Python 3.11"
        uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5.0.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "Install dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/contracts
          pip install -e services/telemetry_validation
          pip install -e services/dataset_pipeline
          pip install -e services/ml_training
          pip install -e services/api
          pip install -e services/governance
          pip install pytest pyyaml rfc8785

      - name: "Execute 35-Step End-to-End System Demonstration"
        run: |
          python scripts/run_phase8_demo.py

      - name: "Run End-to-End Test Suite"
        run: |
          python -m pytest tests/system/end_to_end -v
