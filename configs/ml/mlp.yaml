version: "1.2.0"
model_family: "PyTorchMLP"

architecture:
  hidden_dims: [128, 64]
  dropout_rate: 0.2
  activation: "relu"
  batch_norm: true

training:
  batch_size: 64
  epochs: 25
  learning_rate: 0.001
  weight_decay: 0.0001
  optimizer: "AdamW"
  loss_fn: "BCEWithLogitsLoss"
  pos_weight: 1.0
  grad_clip_norm: 1.0
  early_stopping_patience: 5
  seed: 42
  device: "cpu"
