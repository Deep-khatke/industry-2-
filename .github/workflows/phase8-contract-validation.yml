name: "Phase 8 — Cross-Component Contract Validation"

on:
  push:
    branches: ["main", "feature/phase8-integration-reliability"]
    paths:
      - "packages/**"
      - "services/**"
      - "tools/phase8/**"
      - "tests/system/contracts/**"
      - ".github/workflows/phase8-contract-validation.yml"
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: phase8-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-contracts:
    name: "Cross-Component Contract Matrix Audit"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "Checkout repository code"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: "Set up Python 3.11"
        uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5.0.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "Install dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/contracts
          pip install -e services/telemetry_validation
          pip install -e services/dataset_pipeline
          pip install -e services/ml_training
          pip install -e services/api
          pip install -e services/governance
          pip install pytest pyyaml rfc8785

      - name: "Run Contract Matrix Verification"
        run: |
          python tools/fcs_cli.py verify contracts
          python -m pytest tests/system/contracts -v
