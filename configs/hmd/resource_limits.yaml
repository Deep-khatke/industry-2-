# FCS-HMD Resource Limits Configuration (Zero-Cost Local CPU Execution)
version: "1.2.0"

limits:
  max_memory_mb: 1024
  max_cpu_workers: 2
  max_specialist_concurrency: 2
  max_inference_queue_length: 1000
  max_model_loading_time_ms: 5000.0
  max_specialist_inference_time_ms: 100.0
  max_total_pipeline_time_ms: 250.0
  max_training_rows_per_experiment: 10000
  max_training_duration_sec: 300.0
  max_artifact_size_mb: 50.0

budget_policy:
  enforce_zero_cost: true
  allow_paid_cloud_services: false
  allow_paid_apis: false
  allow_paid_gpus: false
