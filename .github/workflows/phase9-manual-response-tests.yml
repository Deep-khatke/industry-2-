name: "Phase 9 — Manual Response Safety & Simulator Tests"

on:
  push:
    branches: ["main", "feature/phase9-isp-pilot"]
    paths:
      - "services/pilot-management/src/fcs_pilot/response_validation/**"
      - "tests/pilot-security/test_pilot_safety_and_isolation.py"
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: phase9-response-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-manual-response:
    name: "Validate Protected Asset Rejection & Simulator Read-Back"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5.0.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "Install dependencies"
        run: |
          pip install -e packages/contracts
          pip install -e services/pilot-management
          pip install pytest pyyaml numpy pydantic

      - name: "Run Manual Response Safety Tests"
        run: |
          pytest tests/pilot-security/test_pilot_safety_and_isolation.py -v
