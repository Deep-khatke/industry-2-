# FCS Environment Configuration: DEVELOPMENT
environment: DEVELOPMENT
project_name: Federated Cyber Shield
version: 1.2.0

security:
  debug_mode: true
  allow_demo_credentials: true
  allow_demo_endpoints: true
  allow_synthetic_replay: true
  auto_live_enabled: false
  jwt_expiration_minutes: 1440
  enforce_mfa: false
  trusted_hosts:
    - "127.0.0.1"
    - "localhost"
  cors_allowed_origins:
    - "http://127.0.0.1:8000"
    - "http://localhost:8000"
    - "http://127.0.0.1:5173"
    - "http://localhost:5173"
    - "http://127.0.0.1:3000"
    - "http://localhost:3000"

storage:
  db_path: "data/fcs_phase4.db"
  backup_dir: "data/backups"
  model_registry_dir: "artifacts/candidate-models"

detection:
  window_duration_seconds: 30.0
  allowed_lateness_seconds: 60.0
  incident_grouping_window_seconds: 300
  default_model_id: "lightgbm_deployable_subset"

response:
  mode: MANUAL
  auto_response_enabled: false
  max_action_duration_seconds: 3600
  min_action_duration_seconds: 60
  protected_ip_ranges:
    - "127.0.0.1"
    - "::1"
    - "10.0.0.1"
    - "192.168.1.1"
    - "0.0.0.0/0"
    - "255.255.255.255"
    - "1.1.1.1"
    - "8.8.8.8"
    - "9.9.9.9"

cost_policy:
  budget_cap: 0
  enforce_zero_cost: true
