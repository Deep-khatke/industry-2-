name: "Security - Tenant Isolation & Secret Audit"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  security-verification:
    name: "Security Isolation & Secrets Hygiene"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: "Setup Python 3.11"
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "Install Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: "Run Tenant Isolation & Security Tests"
        run: python -m pytest tests/security/

      - name: "Run Zero-Cost Secret Scanner"
        run: |
          python -c "
          from packages.security.scanner import RepositorySecretScanner
          scanner = RepositorySecretScanner('.')
          res = scanner.scan_repository()
          print(f'Scanned {res.scanned_files_count} files.')
          if not res.passed:
              for f in res.findings:
                  print(f'SECRET FINDING [{f.rule_name}] in {f.file_path}:{f.line_number}')
              exit(1)
          print('Clean: No credentials or secrets found in repository.')
          "
