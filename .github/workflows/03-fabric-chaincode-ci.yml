name: 03-Fabric-Chaincode-CI

on:
  push:
    branches: [ main, feature/* ]
    paths:
      - 'services/chaincode/**'
      - '.github/workflows/03-fabric-chaincode-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'services/chaincode/**'
      - '.github/workflows/03-fabric-chaincode-ci.yml'

permissions:
  contents: read

concurrency:
  group: chaincode-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chaincode-tests:
    name: Go Vet & Hyperledger Fabric Chaincode Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/chaincode/governance

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: services/chaincode/governance/go.mod

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Chaincode Unit Tests
        run: go test -v -cover ./...
