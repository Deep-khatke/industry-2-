name: "Phase 9 — Pilot Readiness & Gate Evaluation"

on:
  push:
    branches: ["main", "feature/phase9-isp-pilot"]
    paths:
      - "services/pilot-management/**"
      - "configs/pilot/**"
      - "scripts/verify_phase9.py"
      - "phase9_status.json"
      - ".github/workflows/phase9-pilot-readiness.yml"
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: phase9-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit-readiness-gates:
    name: "Audit 23 Pilot Readiness Gates (R01-R23) & Zero-Cost Compliance"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "Checkout repository code"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: "Set up Python 3.11"
        uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5.0.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "Install dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/contracts
          pip install -e services/telemetry_validation
          pip install -e services/dataset_pipeline
          pip install -e services/ml_training
          pip install -e services/api
          pip install -e services/federated-learning
          pip install -e services/governance
          pip install -e services/pilot-management
          pip install pytest pyyaml rfc8785 psutil numpy

      - name: "Run Phase 9 Verification Program"
        run: |
          python scripts/verify_phase9.py

      - name: "Run Phase 9 Experiment Program (E9-01 to E9-28)"
        run: |
          python scripts/run_phase9_experiments.py

      - name: "Verify Strict Zero-Cost Policy & Safety Invariants"
        run: |
          python -c "
          import json
          with open('phase9_status.json') as f:
              st = json.load(f)
          assert st['zero_cost_budget'].startswith('STRICTLY ₹0 / $0')
          assert st['response_mode'].startswith('MANUAL_ONLY')
          assert st['network_action_executed'] is False
          assert st['pilot_readiness_decision'] == 'READY_FOR_AUTHORIZED_SHADOW_PILOT'
          assert st['readiness_gates']['passed'] == 23
          print('CI Zero-Cost and Pilot Safety Invariants Verified.')
          "
