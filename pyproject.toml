[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "federated-cyber-shield"
version = "0.1.0"
description = "Privacy-preserving cloud-oriented cybersecurity platform for rural Internet Service Providers (Phase 1 Foundation)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Federated Cyber Shield Architecture Team" }
]
keywords = [
    "cybersecurity",
    "telemetry",
    "ipfix",
    "netflow",
    "multi-tenancy",
    "zero-trust",
    "rural-isp"
]
dependencies = [
    "pydantic>=2.7.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "boto3>=1.34.0",
]
aws = [
    "boto3>=1.34.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["packages*", "services*", "adapters*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    ".",
    "packages",
    "services",
    "adapters",
    "tools"
]
addopts = "-v --strict-markers -ra"
markers = [
    "unit: Unit tests verifying discrete components in isolation",
    "integration: Integration tests exercising end-to-end telemetry flows",
    "security: Security and tenant isolation validation tests",
    "fault_injection: Fault tolerance and edge-case handling tests",
    "infrastructure: Static analysis of OpenTofu / IaC configurations",
    "blocked_zero_cost: Tests requiring paid cloud infrastructure (deferred)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # Line length handled by formatter
    "B008",  # Do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["packages", "services", "adapters", "tools"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
