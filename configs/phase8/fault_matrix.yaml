# FCS Phase 8 Machine-Readable Fault Injection Matrix (F01 - F30)
# Defines all target components, injected faults, preconditions, expected safe behaviors, and residual risks.

version: "1.2.0"
faults:
  - id: "F01"
    target: "IPFIX Collector"
    fault: "Collector service abrupt crash/SIGKILL"
    preconditions: "Continuous synthetic flow ingestion active"
    expected_safe_behavior: "Buffer drained to disk or quarantined; supervisor restarts process; no data corruption"
    residual_risk: "Transient packet drop during restart window if exporter buffer fills"

  - id: "F02"
    target: "Tenant Stream Adapter"
    fault: "Adapter memory sink buffer overflow"
    preconditions: "Ingestion rate exceeding memory limit (10,000 events)"
    expected_safe_behavior: "Oldest events dropped or redirected to backpressure queue; metrics incremented; no crash"
    residual_risk: "Unbounded burst may cause observable flow loss"

  - id: "F03"
    target: "Event Replay Engine"
    fault: "Replay duplicate event batch with identical IDs"
    preconditions: "Batch of 100 FlowEvents previously committed"
    expected_safe_behavior: "Idempotent suppression by deterministic event_id; zero duplicate incidents or state changes"
    residual_risk: "Minor CPU overhead on hash verification"

  - id: "F04"
    target: "Feature Window Engine"
    fault: "Corrupt window state with NaN values or missing fields"
    preconditions: "Active window accumulation for tenant rural-isp-alpha"
    expected_safe_behavior: "Window rejected at FeatureSpec validation; error logged; inference not invoked"
    residual_risk: "One missing 10s window aggregation"

  - id: "F05"
    target: "Model Registry"
    fault: "Tampered or corrupted model weights file"
    preconditions: "Model artifact modified on disk prior to loading"
    expected_safe_behavior: "Integrity check fails with SHA-256 mismatch; model load aborted; fallback engaged"
    residual_risk: "Detection runs on fallback model until artifact restored"

  - id: "F06"
    target: "General Detector"
    fault: "Inference timeout (>2.0s latency)"
    preconditions: "Simulated thread stall or synthetic sleep during predict_proba"
    expected_safe_behavior: "Timeout triggered; circuit breaker trips; fallback to rules-based detector"
    residual_risk: "Slightly reduced detection sensitivity during fallback"

  - id: "F07"
    target: "Tenant Anomaly Model"
    fault: "Anomaly model unavailable or uninitialized"
    preconditions: "Tenant has not calibrated baseline IsolationForest"
    expected_safe_behavior: "Anomaly score set to ABSTAIN/UNKNOWN; general detector score used with degraded flag"
    residual_risk: "Novel zero-day anomaly without signature may not be flagged"

  - id: "F08"
    target: "DDoS Specialist Model"
    fault: "Specialist inference crash or timeout"
    preconditions: "Triggered Level 1 routing sends window to specialist"
    expected_safe_behavior: "Specialist timeout handled; Level 1 evidence preserved; incident generated with warning"
    residual_risk: "Granular DDoS sub-type classification missing"

  - id: "F09"
    target: "Evidence Fusion Engine"
    fault: "Conflicting model scores (Level 1 high, Anomaly low, Specialist abstain)"
    preconditions: "Synthesized adversarial feature vector"
    expected_safe_behavior: "Deterministic rule floor preserves priority; evidence explanations include discordance"
    residual_risk: "Analyst must manually adjudicate split evidence"

  - id: "F10"
    target: "Incident Database"
    fault: "Database lock or transient I/O interruption"
    preconditions: "Simultaneous incident creation and query load"
    expected_safe_behavior: "Transaction rollback; bounded exponential retry with jitter; event preserved in memory"
    residual_risk: "Slight latency increase in incident display"

  - id: "F11"
    target: "Transactional Outbox Relay"
    fault: "Outbox relay process restart during pending commit"
    preconditions: "5 pending audit events in outbox table"
    expected_safe_behavior: "Transactions resumed from SQLite WAL checkpoint; events delivered with idempotency"
    residual_risk: "Duplicate ledger submission safely suppressed by tx_id"

  - id: "F12"
    target: "Notification Worker"
    fault: "WebSocket / Notification client disconnect"
    preconditions: "SOC frontend active with real-time incident subscription"
    expected_safe_behavior: "Event queued for reconnecting client; heartbeat detects drop; no server leak"
    residual_risk: "Analyst sees incident upon page refresh or reconnect"

  - id: "F13"
    target: "Backend API Server"
    fault: "FastAPI process termination during request"
    preconditions: "Active REST request to /v1/incidents"
    expected_safe_behavior: "Client receives 502/503; Uvicorn / supervisor recovers; state persisted in SQLite"
    residual_risk: "Client must retry idempotent request"

  - id: "F14"
    target: "React Dashboard"
    fault: "Network disconnect from backend"
    preconditions: "Analyst viewing Manual Response Center"
    expected_safe_behavior: "Degraded status banner shown; approval buttons disabled; auto-reconnect polling"
    residual_risk: "Response actions cannot be submitted during disconnect"

  - id: "F15"
    target: "Federated Learning Coordinator"
    fault: "Coordinator node crash mid-round"
    preconditions: "Flower training round 2 in progress"
    expected_safe_behavior: "Round marked ABORTED; clients disconnect safely; privacy budget refunded/held closed"
    residual_risk: "Partial round compute discarded"

  - id: "F16"
    target: "Federated Learning Clients"
    fault: "Participant dropout (2 out of 7 clients)"
    preconditions: "Round requires 5-of-7 participation"
    expected_safe_behavior: "SecAgg+ reconstructs aggregate using surviving 5 clients; round succeeds"
    residual_risk: "Slightly higher per-round variance"

  - id: "F17"
    target: "Secure Aggregation (SecAgg+)"
    fault: "Severe client dropout (3 or more clients drop)"
    preconditions: "Only 4 clients respond during aggregation phase"
    expected_safe_behavior: "SecAgg+ quorum fails (<5); round explicitly ABORTED; zero plaintext model fallback"
    residual_risk: "Round produces no candidate model"

  - id: "F18"
    target: "Privacy Accountant"
    fault: "Corrupt accountant state file on disk"
    preconditions: "Epsilon budget tracking active"
    expected_safe_behavior: "Accountant fails closed; training blocked until administrative verification"
    residual_risk: "Training halted until recovery"

  - id: "F19"
    target: "Governance Ledger"
    fault: "Ledger network outage (SmartBFT ordering nodes offline)"
    preconditions: "Threat detection active while ledger is unreachable"
    expected_safe_behavior: "Detection continues 100% uninterrupted; audit events buffered in outbox; reconciles on recovery"
    residual_risk: "New candidate models cannot be promoted during outage"

  - id: "F20"
    target: "Hyperledger Fabric Chaincode"
    fault: "Invalid or duplicate transaction submission"
    preconditions: "Tx with reused nonce or unapproved MSP submitted"
    expected_safe_behavior: "Transaction rejected with explicit chaincode error; state unmodified"
    residual_risk: "Failed transaction logged in audit trail"

  - id: "F21"
    target: "Trust Store & Key Registry"
    fault: "Revocation of active signing key"
    preconditions: "ECDSA or ML-DSA key marked REVOKED in trust store"
    expected_safe_behavior: "Signatures created with revoked key fail verification immediately"
    residual_risk: "Models signed by revoked key require re-signing with rotated key"

  - id: "F22"
    target: "Model Promotion Pipeline"
    fault: "Attempt to promote unapproved or single-signed model"
    preconditions: "Candidate model has only 1 of 2 required signatures"
    expected_safe_behavior: "Promotion rejected; state remains CANDIDATE; active model unchanged"
    residual_risk: "Unapproved model never reaches production"

  - id: "F23"
    target: "Firewall Simulator"
    fault: "Simulator process unavailable or device timeout"
    preconditions: "Analyst approves defensive mitigation action"
    expected_safe_behavior: "Action marked PENDING_RETRY or FAILED; device state marked UNVERIFIED; no phantom success"
    residual_risk: "Action not enforced until simulator responds"

  - id: "F24"
    target: "Firewall Rollback Engine"
    fault: "Rollback execution failure during TTL expiry"
    preconditions: "Temporary block rule reached 3600s TTL"
    expected_safe_behavior: "Alert raised to SOC analyst; rule flagged EXPIRED_PENDING_MANUAL_REMOVAL; logged"
    residual_risk: "Rule remains active until analyst manually clears"

  - id: "F25"
    target: "Observability Engine"
    fault: "Telemetry exporter stops sending (silent freeze)"
    preconditions: "Exporter rural-isp-golf goes silent for 60 seconds"
    expected_safe_behavior: "Freshness gauge drops; status marked DEGRADED; alert raised; NOT reported as zero threat"
    residual_risk: "Blind spot on unmonitored ISP segment until restored"

  - id: "F26"
    target: "Disk Storage"
    fault: "Simulated disk exhaustion in isolated test sandbox"
    preconditions: "Temp disk quota set to 10MB"
    expected_safe_behavior: "Log rotation stops; non-critical telemetry rejected; core DB protects existing state"
    residual_risk: "New flow events cannot be stored until space reclaimed"

  - id: "F27"
    target: "CPU Resources"
    fault: "Controlled CPU saturation (synthetic multi-core spin in testbed)"
    preconditions: "100% CPU load injected on 2 worker threads"
    expected_safe_behavior: "Inference latency increases; p99 bounds preserved; requests queued with timeout"
    residual_risk: "Window-to-incident delay increases to 8s"

  - id: "F28"
    target: "Memory Resources"
    fault: "Controlled memory pressure (synthetic 500MB allocation in sandbox)"
    preconditions: "High memory utilization injected"
    expected_safe_behavior: "Garbage collection triggered; stream adapter limits buffer size; no OOM crash"
    residual_risk: "Temporary cache eviction"

  - id: "F29"
    target: "Service Lifecycle"
    fault: "Abrupt service restart during in-flight transaction"
    preconditions: "Incident creation request halfway through processing"
    expected_safe_behavior: "ACID rollback on SQLite; client retry succeeds; state consistent"
    residual_risk: "Single request retried"

  - id: "F30"
    target: "Backup & Disaster Recovery"
    fault: "Database file corruption followed by recovery from backup"
    preconditions: "Recent valid snapshot in artifacts/backups/"
    expected_safe_behavior: "Integrity check fails on corrupt DB; restore restores consistent state; zero data loss of committed history"
    residual_risk: "Only uncommitted in-flight records at moment of corruption lost"
