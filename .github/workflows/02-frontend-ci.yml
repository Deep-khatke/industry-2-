name: 02-Frontend-CI

on:
  push:
    branches: [ main, feature/* ]
    paths:
      - 'apps/security-dashboard/**'
      - '.github/workflows/02-frontend-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/security-dashboard/**'
      - '.github/workflows/02-frontend-ci.yml'

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-build-and-test:
    name: React TypeScript Build & Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/security-dashboard

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/security-dashboard/package-lock.json

      - name: Install Node Dependencies
        run: npm ci

      - name: Typecheck and Build Production Bundle
        run: npm run build
